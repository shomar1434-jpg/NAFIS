<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شهادة الطالب | تدريبات نافس</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px;color:#0b2430;background:radial-gradient(circle at 10% 10%,rgba(64,175,112,.13),transparent 28rem),#f4f8fa;font-family:"Tajawal","Alyamama",Tahoma,Arial,sans-serif}.toolbar{display:flex;justify-content:center;gap:10px;margin-bottom:18px}.toolbar button,.toolbar a{min-height:44px;padding:10px 18px;border:0;border-radius:999px;color:#fff;background:#257eb4;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}.certificate{width:min(1000px,100%);min-height:690px;margin:auto;padding:24px;border:9px double #257eb4;background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(234,242,243,.96));box-shadow:0 24px 70px rgba(11,36,48,.18);position:relative;overflow:hidden}.certificate:before,.certificate:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(64,175,112,.09)}.certificate:before{right:-130px;top:-140px}.certificate:after{left:-120px;bottom:-150px;background:rgba(37,126,180,.08)}.inner{min-height:625px;padding:42px;border:2px solid #40af70;text-align:center;position:relative;z-index:1}.logo{display:block;width:145px;height:104px;margin:auto;padding:8px;border-radius:18px;background:#fff;object-fit:contain;box-shadow:0 6px 20px rgba(11,36,48,.08)}.school{margin:14px 0 4px;color:#15445a;font-size:20px;font-weight:900}.certificate h1{margin:24px 0 10px;color:#257eb4;font-size:44px}.lead{margin:0;color:#657980;font-size:20px}.student{margin:23px auto 15px;color:#15445a;font-size:38px;font-weight:900}.certificate p{font-size:19px;line-height:2}.score{display:inline-flex;gap:25px;margin:18px auto;padding:14px 25px;border-radius:18px;background:#eaf2f3}.score b{display:block;color:#257eb4;font-size:28px}.score span{font-size:13px;font-weight:800}.meta{display:flex;justify-content:space-between;gap:18px;margin-top:32px;padding-top:18px;border-top:1px solid #d8e5e8;color:#657980;font-size:14px}.author{margin-top:16px;color:#218452;font-weight:900}.empty{display:grid;place-items:center;min-height:500px;font-size:21px;font-weight:800}.level{color:#218452;font-weight:900}@media(max-width:700px){body{padding:10px}.certificate{padding:10px;border-width:6px}.inner{padding:26px 15px}.certificate h1{font-size:31px}.student{font-size:28px}.certificate p{font-size:16px}.meta{flex-direction:column}.score{gap:12px}}@page{size:A4 landscape;margin:0}@media print{body{padding:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar{display:none}.certificate{width:297mm;height:210mm;min-height:210mm;padding:8mm;border-width:3mm;box-shadow:none}.inner{min-height:184mm;padding:11mm}.certificate h1{font-size:34pt}.student{font-size:27pt}}
  </style>
</head>
<body>
  <div class="toolbar"><a href="index.html">العودة للبوابة</a><button type="button" onclick="window.print()">طباعة الشهادة أو حفظها PDF</button></div>
  <main class="certificate" id="certificate"><div class="empty">جارٍ إعداد الشهادة...</div></main>
  <script>
    (function(){
      const TESTS={
        'grade3-primary-arabic':['لغتي الجميلة','الصف الثالث الابتدائي'],'grade3-primary-math':['الرياضيات','الصف الثالث الابتدائي'],
        'grade6-primary-arabic':['لغتي الجميلة','الصف السادس الابتدائي'],'grade6-primary-science':['العلوم','الصف السادس الابتدائي'],'grade6-primary-math':['الرياضيات','الصف السادس الابتدائي'],
        'grade3-middle-arabic':['لغتي الجميلة','الصف الثالث المتوسط'],'grade3-middle-science':['العلوم','الصف الثالث المتوسط'],'grade3-middle-math':['الرياضيات','الصف الثالث المتوسط']
      };
      const read=(key)=>{try{return JSON.parse(localStorage.getItem(key))}catch(_){return null}};
      const profile=read('safa_nafs_student_v1'); const progress=read('safa_nafs_progress_v1')||{}; const id=new URLSearchParams(location.search).get('test'); const test=TESTS[id]; const item=progress[id]; const root=document.getElementById('certificate');
      const esc=(v)=>String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
      if(!profile||!test||!item?.completed){root.innerHTML='<div class="empty">لا توجد نتيجة مكتملة لإصدار الشهادة.</div>';return}
      const pct=Number(item.bestPercent||0); const passed=pct>=60; const kind=passed?'شهادة اجتياز':'شهادة تحفيز واستمرار'; const level=pct>=90?'مستوى متميز':pct>=80?'مستوى متقن':pct>=60?'مستوى مجتاز':'يحتاج إلى مزيد من التدريب'; const date=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{year:'numeric',month:'long',day:'numeric'}).format(new Date(item.lastCompletedAt)); const code='SAFA-'+profile.id+'-'+id.replace(/[^a-z0-9]/g,'').slice(-8).toUpperCase()+'-'+String(new Date(item.lastCompletedAt).getTime()).slice(-6);
      root.innerHTML='<div class="inner"><img class="logo" src="assets/moe-logo.svg" alt="شعار وزارة التعليم"><div class="school">مدرسة الصفا المتوسطة بجازان</div><h1>'+kind+'</h1><p class="lead">تُمنح هذه الشهادة للطالب</p><div class="student">'+esc(profile.name)+'</div><p>تقديرًا لإتمام تدريب <strong>'+test[0]+'</strong> ضمن تدريبات اختبارات نافس<br><span class="level">'+level+'</span></p><div class="score"><div><b>'+pct+'%</b><span>أفضل نتيجة</span></div><div><b>'+Number(item.attempts||1)+'</b><span>عدد المحاولات</span></div></div><div class="meta"><span>'+test[1]+(profile.classRoom?' · الفصل '+esc(profile.classRoom):'')+'</span><span>تاريخ الإصدار: '+date+'</span><span>رقم التحقق: '+code+'</span></div><div class="author">من إعداد الأستاذ عمر صالح علان</div></div>';
    })();
  </script>
</body>
</html>
